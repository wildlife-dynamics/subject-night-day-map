id: subject_day_night_location_map
requirements:
- name: ecoscope-platform
  version: ==2.25.3
  channel: https://repo.prefix.dev/ecoscope-workflows/

- name: ecoscope-workflows-ext-custom
  version: ==0.1.3
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

- name: pydeck
  version: ==0.9.2
  channel: conda-forge

rjsf-overrides:
  properties:
    # Subject Group: a drop-down of the chosen EarthRanger site's subject group names
    subjectgroup_observations.properties.subject_group_name:
      title: Subject Group Name
      type: string
      description: >-
        The EarthRanger subject group to map, picked from the chosen data source's subject groups.
        ⚠️ The use of a group with mixed subtypes could lead to unexpected results.
      ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: subject_group_name
          depends_on: properties.er_connection.properties.data_source.properties.name

    # Track Order and Colors group. Track Order: which tracks draw on top where they overlap
    Track Order and Colors.properties.values.properties.ascending:
      title: Night tracks on top
      type: boolean
      default: true
      description: Draw night tracks over day tracks where they overlap. Untick to draw day tracks on top.

    # Day/Night Color: colour pickers. These overrides only reach rjsf.json; params.json keeps
    # set_string_var's plain required string, which is what the run is validated against.
    # Title ' ' (not '') hides the field label; an empty string falls back to the name "var".
    Track Order and Colors.properties.day_color.properties.var:
      title: ' '
      type: string
      format: color
      default: '#e7a553'
      description: Colour of the tracks recorded during the day.
    Track Order and Colors.properties.night_color.properties.var:
      title: ' '
      type: string
      format: color
      default: '#292965'
      description: Colour of the tracks recorded at night.

  $defs:
    # Restrict category groupers to Subject Name
    ValueGrouper.properties.index_name.oneOf:
      - const: subject_name
        title: Subject Name

task-instance-defaults:
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped

workflow:
- name: Set Workflow Details
  id: workflow_details
  task: set_workflow_details

- name: Set Time Range
  id: time_range
  task: set_time_range

- name: Connect to EarthRanger
  id: er_connection
  task: set_er_connection

- name: Set Groupers
  id: groupers
  task: set_groupers

- name: Basemap URLs
  id: base_maps
  task: set_base_maps

- name: Subject Group
  id: subjectgroup_observations
  task: get_subjectgroup_observations
  partial:
    time_range: ${{ workflow.time_range.return }}
    client: ${{ workflow.er_connection.return }}
    raise_on_empty: true
    include_details: false
    include_subjectsource_details: false
    filter: clean
    include_subject_additional: false

- name: Process Relocations
  id: relocations
  task: process_relocations
  partial:
    observations: ${{ workflow.subjectgroup_observations.return }}
    filter_point_coords:
    - x: 180
      y: 90
    - x: 0
      y: 0
    - x: 1
      y: 1
    relocs_columns:
    - groupby_col
    - fixtime
    - junk_status
    - geometry
    - extra__subject__name
    - extra__subject__hex
    - extra__subject__sex
    - extra__created_at
    - extra__subject__subject_subtype

- name: Classify Is Night
  id: is_night
  task: classify_is_night
  partial:
    relocations: ${{ workflow.relocations.return }}

- name: Persist Relocations
  id: persist_relocations
  task: persist_df
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    df: ${{ workflow.is_night.return }}
    filename: relocations
    filetype: geoparquet

- name: Relocations To Trajectory
  id: to_trajectory
  task: relocations_to_trajectory
  partial:
    relocations: ${{ workflow.is_night.return }}

- name: Persist Trajectories
  id: persist_trajectories
  task: persist_df
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
    df: ${{ workflow.to_trajectory.return }}
    filename: trajectories
    filetype: geoparquet

- name: Map Columns
  id: columns
  task: map_columns
  partial:
    df: ${{ workflow.to_trajectory.return }}
    rename_columns:
      extra__hex: hex_color
      extra__is_night: day_night
      extra__name: subject_name
      extra__sex: subject_sex
      extra__subject_subtype: subject_subtype
      extra__created_at: created_at
    drop_columns:
    - extra__patrol_serial_number
    - extra__patrol_status
    - extra__patrol_subject
    - extra__patrol_type__value
    retain_columns: []
    raise_if_not_found: true
    duplicate_strategy: suffix

- name: Day Night To String
  id: day_night_string
  task: convert_column_values_to_string
  partial:
    df: ${{ workflow.columns.return }}
    columns:
    - day_night

- name: Label Day Night
  id: day_night_labels
  task: map_values
  partial:
    df: ${{ workflow.day_night_string.return }}
    column_name: day_night
    value_map:
      'False': Day
      'True': Night
    missing_values: preserve
    replacement: null

- title: Track Order and Colors
  type: task-group
  description: Which tracks draw on top, and the colours for day and night tracks and their legend entries.
  tasks:
  # Rows draw in order, so the label sorted last ends up on top: "Day" < "Night",
  # so ascending puts night over day. `ascending` is the form's "night on top" checkbox.
  - name: Track Order
    id: values
    task: sort_values
    partial:
      df: ${{ workflow.day_night_labels.return }}
      column_name: day_night
      na_position: last
  - name: Day Color
    id: day_color
    task: set_string_var
  - name: Night Color
    id: night_color
    task: set_string_var

# A {label: colour} dict, so each label keeps its colour whatever order the rows are in.
- name: Apply Color Map
  id: color_map
  task: apply_color_map
  partial:
    df: ${{ workflow.values.return }}
    input_column_name: day_night
    colormap:
      Day: ${{ workflow.day_color.return }}
      Night: ${{ workflow.night_color.return }}
    output_column_name: day_night_colors

- name: Split Groups
  id: groups
  task: split_groups
  partial:
    df: ${{ workflow.color_map.return }}
    groupers: ${{ workflow.groupers.return }}

- name: Create Path Layer
  id: path_layer
  task: create_path_layer
  partial:
    legend:
      title: Day Night Tracks
      label_column: day_night
      color_column: day_night_colors
      sort: ascending
    layer_style:
      auto_highlight: false
      opacity: 0.65
      pickable: true
      get_path: geometry.coordinates
      get_color: day_night_colors
      get_width: 1.25
      width_scale: 1
      width_min_pixels: 0
      width_max_pixels: null
      width_units: pixels
      cap_rounded: true
      joint_rounded: true
      billboard: true
    tooltip_columns:
    - day_night
    - subject_name
    - subject_sex
    data_url: null
  mapvalues:
    argnames:
    - geodataframe
    argvalues: ${{ workflow.groups.return }}

- name: Compute Fitted View State
  id: fitted_view_state
  task: compute_fitted_view_state
  partial:
    max_zoom: 20
  mapvalues:
    argnames:
    - geo_layers
    argvalues: ${{ workflow.path_layer.return }}

- name: Pair up geo_layers, view_state by group
  id: map_step_by_group
  task: groupbykey
  partial:
    iterables:
    - ${{ workflow.path_layer.return }}
    - ${{ workflow.fitted_view_state.return }}

- name: Draw Map
  id: map_step
  task: draw_map
  partial:
    tile_layers: ${{ workflow.base_maps.return }}
    static: false
    output_type: html
    title: ''
    legend_style:
      placement: bottom-right
      format_title: false
    max_zoom: 20
  mapvalues:
    argnames:
    - geo_layers
    - view_state
    argvalues: ${{ workflow.map_step_by_group.return }}

- name: Persist Day Night Map
  id: day_night_map
  task: persist_text
  partial:
    root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
  mapvalues:
    argnames:
    - text
    argvalues: ${{ workflow.map_step.return }}

- name: Create Map Widget Single View
  id: map_widget_single_view
  task: create_map_widget_single_view
  skipif:
    conditions:
      - never
  partial:
    title: Day Night Tracks
  map:
    argnames:
    - view
    - data
    argvalues: ${{ workflow.day_night_map.return }}

- name: Merge Widget Views
  id: widget_views
  task: merge_widget_views
  partial:
    widgets: ${{ workflow.map_widget_single_view.return }}

- name: Gather Dashboard
  id: dashboard
  task: gather_dashboard
  partial:
    details: ${{ workflow.workflow_details.return }}
    widgets: ${{ workflow.widget_views.return }}
    groupers: ${{ workflow.groupers.return }}
    time_range: ${{ workflow.time_range.return }}